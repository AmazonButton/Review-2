services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: review2
      POSTGRES_PASSWORD: review2_local_only
      POSTGRES_DB: smart_order_test
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["review2-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review2 -d smart_order_test"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  review2-db:
